[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "trippulse-scrapers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.45",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "structlog>=24.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
