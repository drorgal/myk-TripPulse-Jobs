services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: trippulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trippulse_jobs
      POSTGRES_USER: trippulse
      POSTGRES_PASSWORD: localdev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trippulse -d trippulse_jobs']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trippulse_redis
    restart: unless-stopped
    command: redis-server --requirepass localdev --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'localdev', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot migration ────────────────────────────────────────────────────
  # Runs prisma migrate deploy and exits. API + Worker wait for it to succeed.

  migrate:
    build: .
    container_name: trippulse_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trippulse:localdev@postgres:5432/trippulse_jobs
    command: pnpm db:migrate:deploy
    restart: 'no'

  # ── Application services ──────────────────────────────────────────────────

  api:
    build: .
    container_name: trippulse_api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://trippulse:localdev@postgres:5432/trippulse_jobs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: localdev
      API_PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    command: node packages/api/dist/index.js

  worker:
    build: .
    container_name: trippulse_worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '9091:9091'
    environment:
      DATABASE_URL: postgresql://trippulse:localdev@postgres:5432/trippulse_jobs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: localdev
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_CONCURRENCY: 5
      WORKER_METRICS_PORT: 9091
      # RentalCars provider — set these to enable the real provider
      # RENTALCARS_API_KEY: your_key_here
      # RENTALCARS_API_URL: https://api.rentalcars.com/v2
      # RENTALCARS_AFFILIATE_ID: your_affiliate_id
    command: node packages/worker/dist/index.js

  # ── Python Scrapers ──────────────────────────────────────────────────────

  scraper:
    build: ./scrapers
    container_name: trippulse_scraper
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trippulse:localdev@postgres:5432/trippulse_jobs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: localdev
      LOG_LEVEL: info
      # Which scrapers to enable (default: all — hertz, sixt, enterprise)
      # Uncomment to limit: ENABLED_SCRAPERS: hertz
    volumes:
      - /dev/shm:/dev/shm   # Chromium requires shared memory

  # ── Monitoring ────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: trippulse_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  loki:
    image: grafana/loki:3.1.0
    container_name: trippulse_loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.1.0
    container_name: trippulse_promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    container_name: trippulse_grafana
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: localdev
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
