services:
  postgres:
    image: postgres:16-alpine
    container_name: trippulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trippulse_jobs
      POSTGRES_USER: trippulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trippulse -d trippulse_jobs']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trippulse_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-localdev} --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-localdev}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
